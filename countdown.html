<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Your Adventure</title>

    <link rel="stylesheet" href="../style.css">

    <style>

        .adventure-box {

            background: rgba(255, 255, 255, 0.92);

            max-width: 650px;

            margin: 40px auto;

            padding: 45px 30px;

            border-radius: 22px;

            box-shadow:
                0 10px 30px rgba(49, 91, 140, 0.12);

        }

        #adventureTitle {

            font-family: 'Playfair Display', serif;

            font-size: 30px;

            color: #183b68;

            margin-bottom: 20px;

        }

        #counter {

            font-size: 52px;

            font-weight: 600;

            color: #3978c9;

            margin: 25px 0;

        }

        #message {

            font-size: 17px;

            line-height: 1.8;

            color: #526b89;

        }

        .back-home {

            color: #3978c9;

            text-decoration: none;

            font-weight: 500;

        }

        .back-home:hover {

            text-decoration: underline;

        }

    </style>

</head>


<body>

<section class="landing">

    <div class="glass">

        <h1 class="title">
            ⏳ Your Adventure
        </h1>

        <p class="subtitle">
            Every day is another chapter.
        </p>


        <div class="adventure-box">

            <h2 id="adventureTitle"></h2>

            <div id="counter"></div>

            <p id="message"></p>

        </div>


        <br>

        <a
            href="../index.html?dashboard=true"
            class="back-home"
        >
            ← Back to Dashboard
        </a>

    </div>

</section>


<script>

const departureDate = new Date("2026-08-20");

departureDate.setHours(0, 0, 0, 0);


const today = new Date();

today.setHours(0, 0, 0, 0);


const difference = Math.floor(
    (departureDate - today) /
    (1000 * 60 * 60 * 24)
);


const adventureTitle =
    document.getElementById("adventureTitle");

const counter =
    document.getElementById("counter");

const message =
    document.getElementById("message");


/* BEFORE FRANCE */

if (difference > 0) {

    adventureTitle.innerHTML =
        "Your adventure begins in";

    counter.innerHTML =
        difference + " Days";

    message.innerHTML =
        "France is waiting for you. 🇫🇷<br><br>" +
        "Soon you'll be exploring new places, " +
        "meeting new people and making memories " +
        "you'll carry with you forever. 💙";


}


/* DEPARTURE DAY */

else if (difference === 0) {

    adventureTitle.innerHTML =
        "Today's the day! ✈️";

    counter.innerHTML =
        "Bon voyage! 🇫🇷";

    message.innerHTML =
        "Your French adventure starts today. " +
        "Go make the most amazing memories. 💙";


}


/* AFTER ARRIVING */

else {

    const daysInFrance =
        Math.abs(difference);

    adventureTitle.innerHTML =
        "You've been in France for";

    counter.innerHTML =
        daysInFrance + " Days";

    message.innerHTML =
        "Every day is another little chapter " +
        "of your French adventure. 🇫🇷<br><br>" +

        "Keep exploring, keep trying new things, " +
        "and remember that home will always be " +
        "waiting for you. 💙";

}

</script>

</body>

</html>
